name: Luckypai
description: Luckypai (乐酷天 / LuckyPai Ltd) was a Chinese television home-shopping
  company founded around 2006-2007 that grew into a leading nationwide TV and online
  shopping network, selling home appliances, cosmetics, apparel, food, and digital
  devices. It raised roughly $25M from investors including Lightspeed Venture Partners,
  Intel Capital, and the LOTTE Group, and was acquired by Lotte Home Shopping in 2010
  for approximately $160M. It was surfaced as a portfolio company of
  lightspeed-venture-partners and added to the API Evangelist network as a stub. As
  an acquired, no-longer-operating consumer commerce business it has no public
  developer program, API, or independent web presence; the luckypai.com domain is
  parked and listed for sale.
